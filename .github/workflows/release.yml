# Release: pushing a tag v<APP_VERSION> (the Makefile's) builds what changed since the
# last published release, copies unchanged runtimes from that release, and publishes
# only the three Switch NRO files together:
#   - renpy-loader.nro
#   - renpy-runtime.nro
#   - renpy-7.8.7.nro
name: release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      prev: ${{ steps.plan.outputs.prev }}
      runtime: ${{ steps.plan.outputs.runtime }}
      runtime7: ${{ steps.plan.outputs.runtime7 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            want="v$(sed -n 's/^APP_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile)"
            [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME, but APP_VERSION in the Makefile makes $want"; exit 1; }
          fi
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 50 --json tagName \
                 --jq '.[].tagName' | grep -vx "$GITHUB_REF_NAME" | head -n 1 || true)
          runtime=reuse runtime7=reuse
          if [ -z "$prev" ] \
             || ! gh release view "$prev" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx renpy-runtime.nro \
             || ! git diff --quiet "$prev" HEAD -- runtime/python runtime/renpy runtime/*.c runtime/*.h runtime/renpy/boot docker scripts/build.sh app/diagnostics platform/input platform/filesystem platform/locale third_party/cjson \
             || git diff "$prev" HEAD -- Makefile | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' | grep -qv APP_VERSION; then
            runtime=build
          fi
          if [ -z "$prev" ] \
             || ! gh release view "$prev" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx renpy-7.8.7.nro \
             || ! git diff --quiet "$prev" HEAD -- runtime/python2 runtime/renpy7 runtime/*.c runtime/*.h runtime/renpy/boot docker scripts/build.sh app/diagnostics platform/input platform/filesystem platform/locale third_party/cjson \
             || git diff "$prev" HEAD -- Makefile | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' | grep -qv APP_VERSION; then
            runtime7=build
          fi
          { echo "prev=$prev"; echo "runtime=$runtime"; echo "runtime7=$runtime7"; } >> "$GITHUB_OUTPUT"
          echo "Previous release: ${prev:-none}. Runtime8: $runtime. Runtime7: $runtime7." >> "$GITHUB_STEP_SUMMARY"

  switch:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Loader
        run: scripts/build.sh && sudo chown -R "$(id -u):$(id -g)" dist build
      - name: Runtime 8, built
        if: needs.plan.outputs.runtime == 'build'
        run: |
          scripts/build.sh python
          scripts/build.sh renpy
          scripts/build.sh runtime
          sudo chown -R "$(id -u):$(id -g)" dist build
      - name: Runtime 8, the same file as ${{ needs.plan.outputs.prev }}
        if: needs.plan.outputs.runtime == 'reuse'
        run: gh release download "${{ needs.plan.outputs.prev }}" --repo "$GITHUB_REPOSITORY" -p renpy-runtime.nro -D dist --clobber
      - name: Runtime 7, built
        if: needs.plan.outputs.runtime7 == 'build'
        run: |
          scripts/build.sh python2
          scripts/build.sh renpy7
          scripts/build.sh runtime7
          sudo chown -R "$(id -u):$(id -g)" dist build
      - name: Runtime 7, the same file as ${{ needs.plan.outputs.prev }}
        if: needs.plan.outputs.runtime7 == 'reuse'
        run: gh release download "${{ needs.plan.outputs.prev }}" --repo "$GITHUB_REPOSITORY" -p renpy-7.8.7.nro -D dist --clobber
      - uses: actions/upload-artifact@v6
        with:
          name: switch
          path: |
            dist/renpy-loader.nro
            dist/renpy-runtime.nro
            dist/renpy-7.8.7.nro

  release:
    needs: [plan, switch]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: switch
          path: assets
      - name: Notes
        run: |
          prev="${{ needs.plan.outputs.prev }}"
          from() { [ "$1" = build ] && echo "built from this tag" || echo "the same file as $prev"; }
          cat > notes.md <<EOF
          | File | SD card path | In this release |
          |---|---|---|
          | \`renpy-loader.nro\` | \`sdmc:/switch/renpy-loader/renpy-loader.nro\` | built from this tag |
          | \`renpy-runtime.nro\` | \`sdmc:/switch/renpy-loader/runtimes/renpy-runtime.nro\` | $(from "${{ needs.plan.outputs.runtime }}") |
          | \`renpy-7.8.7.nro\` | \`sdmc:/switch/renpy-loader/runtimes/renpy-7.8.7.nro\` | $(from "${{ needs.plan.outputs.runtime7 }}") |
          EOF
      - run: gh release create "$GITHUB_REF_NAME" assets/*.nro --repo "$GITHUB_REPOSITORY" --title "rpynx ${GITHUB_REF_NAME#v}" --notes-file notes.md
